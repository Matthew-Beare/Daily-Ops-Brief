version: 3.1.2
canonical_timezone: America/New_York
canonical_skill: skill/ops-brief-policy/SKILL.md
runtime_engine: skill/ops-brief-policy/scripts/ops_policy_runtime.py

compatibility:
  purpose: "Legacy machine-readable entry point retained after main reconciliation."
  authority: "The canonical executable policy is the skill/runtime above; this file is a compact compatibility snapshot, not a second source of truth."

brief_schedule:
  title: "2:45 AM/PM Eastern Ops Brief"
  times_et: ["02:45", "14:45"]
  pm_is_morning_brief: true

mode_resolution:
  priority:
    - "unexpired explicit Mode Override in Control"
    - "Active trip in Trips forces ROAD"
    - "weekly operating window"
  home_early:
    closes_current_mileage_accrual: true
    hold_home_through: "next Friday 14:45 ET brief"

appointments:
  saturday_am_weekly_horizon_days: 7
  never_show_confirmation_status: true

mileage_pay:
  authority_sheet_id: "1OUzdjZaVTidLnMX2xuIZ3mRVDOF5oAfT8-pdl6KfUfI"
  rate_per_paid_mile: 0.986
  thursday_summary: true
  accrual_closes_on_confirmed_home_arrival: true
  terminal_paid_miles_directional: true
  reverse_paid_miles_must_be_evidenced: true
  failure_isolation:
    non_thursday: "Mileage read/shape/parse failure must not abort an otherwise valid brief."
    thursday: "Emit Action Required — mileage/pay Sheet unavailable and continue other sections."

receipts:
  one_receipt_id_per_transaction: true
  line_item_categories: true
  balanced_allocations: true
  part_sku_fitment_evidence_required_when_identifiable: true
  unknown_assignment: "queue; never guess"
  cancellation_is_not_refund: true
  unresolved_financial_correction_business_days: 5

email_actions:
  automatic_send: false
  automatic_delete: false
  archive_important_without_approval: false

change_control:
  repository: "Matthew-Beare/Daily-Ops-Brief"
  git_required: true
  automatic_commit_push_after_standing_authorization: true
  automatic_merge: false
