name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover policy fingerprint
        run: python3 scripts/policy_fingerprint.py skill/ops-brief-policy
      - run: python3 scripts/audit_starter_privacy.py starter
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 -m unittest discover -s skill/ops-brief-policy/scripts -p 'test_*.py'
      - run: python3 starter/tools/validate_feature_manifest.py
      - run: python3 -m unittest discover -s starter/tests -p 'test_*.py'
