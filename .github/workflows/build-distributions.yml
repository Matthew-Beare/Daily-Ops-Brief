name: Build Distributions

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Personal-Experimental
        run: |
          python3 scripts/build_distribution.py \
            --channel public-experimental \
            --source-revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/MIRA-Public-Experimental"
          (
            cd "$RUNNER_TEMP/MIRA-Public-Experimental"
            python3 scripts/audit_public_source.py .
            python3 scripts/audit_starter_privacy.py starter
            python3 scripts/validate_distribution.py . \
              --repository Matthew-Beare/MIRA-Public-Experimental \
              --channel public-experimental \
              --source-revision "$GITHUB_SHA"
            python3 -m compileall -q scripts starter
            python3 starter/tools/behavior_dependency_check.py validate
            python3 starter/tools/feature_reconciliation.py sync --check
            python3 starter/tools/validate_feature_manifest.py --check-files
            python3 -m unittest discover -s starter/tests -p 'test_*.py'
            find . -type d -name __pycache__ -prune -exec rm -rf -- {} +
            find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
            python3 scripts/audit_public_source.py .
            python3 scripts/audit_starter_privacy.py starter
            python3 scripts/validate_distribution.py . \
              --repository Matthew-Beare/MIRA-Public-Experimental \
              --channel public-experimental \
              --source-revision "$GITHUB_SHA"
          )
      - name: Build Institutional-Experimental
        run: |
          python3 scripts/build_distribution.py \
            --channel institutional-experimental \
            --source-revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/MIRA-Institutional-Experimental"
          (
            cd "$RUNNER_TEMP/MIRA-Institutional-Experimental"
            python3 scripts/audit_public_source.py .
            python3 scripts/audit_starter_privacy.py starter
            python3 scripts/validate_distribution.py . \
              --repository Matthew-Beare/MIRA-Institutional-Experimental \
              --channel institutional-experimental \
              --source-revision "$GITHUB_SHA"
            python3 -m compileall -q scripts starter
            python3 starter/tools/behavior_dependency_check.py validate
            python3 starter/tools/feature_reconciliation.py sync --check
            python3 starter/tools/validate_feature_manifest.py --check-files
            python3 -m unittest discover -s starter/tests -p 'test_*.py'
            find . -type d -name __pycache__ -prune -exec rm -rf -- {} +
            find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
            python3 scripts/audit_public_source.py .
            python3 scripts/audit_starter_privacy.py starter
            python3 scripts/validate_distribution.py . \
              --repository Matthew-Beare/MIRA-Institutional-Experimental \
              --channel institutional-experimental \
              --source-revision "$GITHUB_SHA"
          )
      - name: Upload Personal-Experimental
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MIRA-Public-Experimental-${{ github.sha }}
          path: ${{ runner.temp }}/MIRA-Public-Experimental
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Upload Institutional-Experimental
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MIRA-Institutional-Experimental-${{ github.sha }}
          path: ${{ runner.temp }}/MIRA-Institutional-Experimental
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
