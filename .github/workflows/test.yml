name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check project-instruction policy sync
        run: python3 tools/project_instructions.py check
      - name: Run deterministic policy tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
