name: Android Client

on:
  pull_request:
    paths:
      - "starter/clients/android/**"
      - ".github/workflows/android-client.yml"
  push:
    branches: [main]
    paths:
      - "starter/clients/android/**"
      - ".github/workflows/android-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug companion APK
        working-directory: starter/clients/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mira-android-debug-apk
          if-no-files-found: error
          path: starter/clients/android/app/build/outputs/apk/debug/app-debug.apk
