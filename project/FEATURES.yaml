    acceptance:
      - Reconciliation decisions are deterministic for equivalent inputs.
      - Canonical identity and provenance are preserved.
      - Ambiguous conflicts are surfaced instead of silently guessed.
      - Retry paths are idempotent where mutation can be repeated.
