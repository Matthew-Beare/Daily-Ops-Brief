  - id: MIRA-F009
    name: Ops Brief
    layer: MIRA
    phase: native_mira_v1
    status: required_verify_existing
    platforms: [chatgpt, android]
    dependencies: [MIRROR-F008]
    triggers:
      manual: "$ops brief"
      scheduled:
        timezone: America/New_York
        times: ["02:45", "14:45"]
        exact_count_per_day: 2
    forbidden_schedule_variants:
      - "03:00 legacy"
      - "Pacific or device-local reinterpretation"
      - "UTC-fixed shift"
      - "noon/midnight"
      - "duplicate/diagnostic/child/retry schedules"
    acceptance:
      - Manual `$ops brief` executes the canonical brief pipeline on demand.
      - Exactly two scheduled briefs run daily at 02:45 and 14:45 America/New_York.
      - No legacy or duplicate Ops Brief schedules remain active.
      - Mutable operational facts are queried from canonical authorities before conclusions.
      - Mode-specific filtering is contract-driven and regression tested.
    notes: "First-class Native MIRA v1 feature. Implementation state must be verified against code/automation state before being marked accepted."

