plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("MIRA_ANDROID_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("MIRA_ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("MIRA_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("MIRA_ANDROID_KEY_PASSWORD")
def releaseSigningReady = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "org.mirror.mira"
    compileSdk 36

    defaultConfig {
        applicationId "org.mirror.mira"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "0.2.0"
    }

    sourceSets {
        main.assets.srcDirs += ["../../pwa"]
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "com.google.android.gms:play-services-auth:21.5.0"
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
}
